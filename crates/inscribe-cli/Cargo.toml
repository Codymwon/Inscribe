[package]
name = "inscribe-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "inscribe_cli"
path = "src/lib.rs"

[[bin]]
name = "inscribe"
path = "src/main.rs"

[dependencies]
inscribe-core.workspace = true
clap.workspace = true
indicatif.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
inscribe-core = { path = "../inscribe-core", features = ["test-utils"] }

[features]
default = []
test-utils = ["inscribe-core/test-utils"]




